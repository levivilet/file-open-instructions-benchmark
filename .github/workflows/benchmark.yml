name: File-open instructions benchmark
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
permissions:
  contents: read
concurrency:
  group: file-open-${{ github.ref }}
  cancel-in-progress: false
jobs:
  accounting:
    name: Hardware accounting
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic build-essential
          sudo sysctl kernel.perf_event_paranoid=-1
          mkdir -p results .tmp
          PERF=$(find -L /usr/lib/linux-tools -name perf -type f | sort | tail -n 1)
          sudo env LC_ALL=C python3 scripts/validate_accounting.py "$PERF"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: hardware-accounting
          path: results/
          if-no-files-found: error
  benchmark:
    name: Open (${{ matrix.editor }})
    needs: accounting
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        editor: [lvce, vscode, geany, electron, zed]
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop, clipboard and perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic python3 python3-websocket curl xz-utils xvfb xauth xdotool x11-utils x11-apps xclip openbox geany=2.0-1build2 dbus-x11 libglib2.0-bin xdg-desktop-portal xdg-desktop-portal-gtk \
            libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libxkbcommon-x11-0 libxkbfile1 libsecret-1-0 \
            mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64
          sudo sysctl kernel.perf_event_paranoid=-1
      - name: Install pinned ARM editor
        run: python3 scripts/install.py --editors "${{ matrix.editor }}"
      - name: Measure three fresh-profile file opens
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          PERF=$(find -L /usr/lib/linux-tools -name perf -type f | sort | tail -n 1)
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run.sh "${{ matrix.editor }}" "$PERF"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: open-${{ matrix.editor }}
          path: results/
          if-no-files-found: error
          retention-days: 90
  profile:
    name: Profile LVCE open
    needs: accounting
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop, clipboard and perf
        run: |
          sudo apt-get update
          sudo apt-get install -y linux-tools-generic python3 python3-websocket curl xz-utils xvfb xauth xdotool x11-utils x11-apps xclip openbox geany=2.0-1build2 \
            libgtk-3-0 libnss3 libgbm1 libxss1 libxtst6 libxkbcommon-x11-0 libxkbfile1 libsecret-1-0 \
            mesa-utils mesa-vulkan-drivers libvulkan1 libasound2t64
          sudo sysctl kernel.perf_event_paranoid=-1
      - name: Install pinned ARM editor
        run: python3 scripts/install.py --editors "lvce"
      - name: Sample three diagnostic file opens
        env:
          BENCHMARK_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          PERF=$(find -L /usr/lib/linux-tools -name perf -type f | sort | tail -n 1)
          xvfb-run -a -s '-screen 0 1280x800x24' bash scripts/run.sh "lvce" "$PERF" scripts/profile_open.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: profile-lvce
          path: results/
          if-no-files-found: error
          retention-days: 90
