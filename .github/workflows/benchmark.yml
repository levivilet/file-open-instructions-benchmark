  report:
    name: Tests and complete report
    if: ${{ !cancelled() }}
    needs: [accounting, benchmark, paired, ipc-paired]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s tests
      - uses: actions/download-artifact@v5
        if: needs.benchmark.result == 'success' && needs.paired.result == 'success' && needs.ipc-paired.result == 'success'
        with:
          pattern: open-*
          path: results/editors
      - uses: actions/download-artifact@v5
        if: needs.paired.result == 'success'
        with:
          name: paired-lvce
          path: results/paired
      - uses: actions/download-artifact@v5
        if: needs.ipc-paired.result == 'success'
        with:
          name: paired-ipc
          path: results/ipc
      - name: Build validated report
        if: needs.benchmark.result == 'success' && needs.paired.result == 'success' && needs.ipc-paired.result == 'success'
        run: python3 scripts/report.py --run-url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' --commit '${{ github.sha }}'
      - uses: actions/upload-artifact@v5
        if: needs.benchmark.result == 'success' && needs.paired.result == 'success' && needs.ipc-paired.result == 'success'
        with:
          name: measured-report
          path: .tmp/pages
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v4
        if: needs.benchmark.result == 'success' && needs.paired.result == 'success' && needs.ipc-paired.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .tmp/pages
      - name: Require full hardware and editor coverage
        if: needs.accounting.result != 'success' || needs.benchmark.result != 'success' || needs.paired.result != 'success' || needs.ipc-paired.result != 'success'
        run: exit 1
  deploy:
    name: Deploy Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: report
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
